<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening Shopee</title>
<style>body{font:17px system-ui,sans-serif;margin:40px 20px;color:#222}a{display:inline-block;margin-top:16px;padding:12px 18px;background:#ee4d2d;color:#fff;border-radius:6px;text-decoration:none}</style>
<!-- Opens a Shopee page in Gear (iPhone) or the browser (laptop), not the Shopee app, so a userscript can run on it.
     Link: https://greekefire.github.io/open/#product/123/456#caro=... -->
<p id="msg">Opening Shopee…</p>
<a id="go" href="#">Tap here if nothing happens</a>
<script>
  // 8 Nov: on the iPhone, orders run in Gear (the userscript there marks <html data-caro> and opens Shopee itself).
  // Anywhere else on the iPhone (Telegram's browser, Safari, Chrome) hop into Gear with gear://open?url=… (the only
  // format Gear takes an address in). #!… = already hopped, so no loop if the script is missing in Gear.
  const raw = location.hash.slice(1), hopped = raw.startsWith('!');
  const path = raw.replace(/^!/, '').replace(/%23/gi, '#');  // Telegram desktop sends the inner # as %23
  if (/^[\w\/.%-]+(#caro=[^<>"']*)?$/.test(path)) {  // shopee.sg paths only
    const clean = path.replace(/&to=.*$/, '');  // the buyer's address never goes on to Shopee
    const gear = 'gear://open?url=' + encodeURIComponent('https://greekefire.github.io/open/#!' + raw.replace(/^!/, ''));
    const iphone = /iPhone|iPad/.test(navigator.userAgent);
    document.getElementById('go').href = iphone && !hopped ? gear : 'https://shopee.sg/' + clean;
    setTimeout(() => {
      if (document.documentElement.dataset.caro) return;  // the userscript has it
      if (iphone && !hopped) { document.getElementById('msg').textContent = 'Opening Gear…'; location.href = gear; }
      else location.replace('https://shopee.sg/' + clean);  // laptop without the script, or Gear without it: just the product
    }, 800);
  } else document.body.innerHTML = '<p>No Shopee link in this address.</p>';
</script>

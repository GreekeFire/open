<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening Shopee</title>
<style>body{font:17px system-ui,sans-serif;margin:40px 20px;color:#222}a{display:inline-block;margin-top:16px;padding:12px 18px;background:#ee4d2d;color:#fff;border-radius:6px;text-decoration:none}</style>
<!-- Opens a Shopee page in Safari, not the Shopee app, so a userscript can run on it.
     Link: https://greekefire.github.io/open/#product/123/456#caro=... -->
<p>Opening Shopee in Safari…</p>
<a id="go" href="#">Tap here if nothing happens</a>
<script>
  const path = location.hash.slice(1);
  if (/^[\w\/.-]+(#caro=[^<>"']*)?$/.test(path)) {  // shopee.sg paths only
    const url = 'https://shopee.sg/' + path;
    document.getElementById('go').href = 'x-safari-https://shopee.sg/' + path;  // iOS 17+: stays in Safari
    location.replace(url);  // a page-made jump, not a tap, so iOS normally doesn't hand it to the app
  } else document.body.innerHTML = '<p>No Shopee link in this address.</p>';
</script>
